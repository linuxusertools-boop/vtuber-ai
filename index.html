<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>YUKI — Personal AI Assistant by Kevsoft Studio</title>
    <meta name="description" content="Chat dengan YUKI, Personal AI Assistant buatan Kevsoft Studio!" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cubism.live2d.com" crossorigin>
    <link rel="preconnect" href="https://cdn.nexray.eu.cc" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Live2D Cubism 4 Core -->
    <script defer src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- PixiJS v6 IIFE build -->
    <script defer src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
    <!-- pixi-live2d-display Cubism4 adapter -->
    <script defer src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

    <!-- Inline: detect iframe + WebGL before React boots -->
    <script>
      window.__IS_IFRAME__ = (function() {
        try { return window.self !== window.top; } catch(e) { return true; }
      })();
      window.__HAS_WEBGL__ = (function() {
        try {
          var c = document.createElement('canvas');
          return !!(c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl'));
        } catch(e) { return false; }
      })();
    </script>
  </head>
  <body style="background:#000">
    <div id="root"></div>
    <noscript><p style="color:#fff;font-family:sans-serif;text-align:center;margin-top:40vh">YUKI membutuhkan JavaScript.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
